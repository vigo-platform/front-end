services:
  front-end:
    image: logtaha/vigo-front-end:${FRONTEND_TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:8080"
    networks:
      - vigo-network

networks:
  vigo-network:
    external: true
    name: ${VIGO_DOCKER_NETWORK:-development_app-network}
