name: Docker Build & Push

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - 'build-and-push'
      - 'build-and-push-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag (leave empty to use commit sha)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  REGISTRY_IMAGE: logtaha/vigo-front-end
  REGISTRY_NAME: Docker Hub

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve Docker Image Tag
        id: resolve_tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RAW_REF: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail

          SHORT_SHA="$(git rev-parse --short HEAD)"
          IS_VERSIONED="false"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            CLEAN_INPUT="$(printf '%s' "$INPUT_TAG" | xargs)"
            if [ -n "$CLEAN_INPUT" ]; then
              IMAGE_TAG="$CLEAN_INPUT"
              IS_VERSIONED="true"
            else
              IMAGE_TAG="sha-$SHORT_SHA"
            fi
            TRIGGER_TYPE="Manual Dispatch"
            GIT_TAG="N/A"
          else
            PREFIX="build-and-push-"
            if [ "$RAW_REF" = "build-and-push" ]; then
              IMAGE_TAG="sha-$SHORT_SHA"
            elif [[ "$RAW_REF" == "$PREFIX"* ]]; then
              IMAGE_TAG="${RAW_REF#$PREFIX}"
              if [ -n "$IMAGE_TAG" ]; then
                IS_VERSIONED="true"
              else
                IMAGE_TAG="sha-$SHORT_SHA"
              fi
            else
              IMAGE_TAG="$RAW_REF"
              IS_VERSIONED="true"
            fi
            TRIGGER_TYPE="Git Tag"
            GIT_TAG="$RAW_REF"
          fi

          {
            echo "image_tag=$IMAGE_TAG"
            echo "is_versioned=$IS_VERSIONED"
            echo "trigger_type=$TRIGGER_TYPE"
            echo "git_tag=$GIT_TAG"
            echo "short_sha=$SHORT_SHA"
            echo "docker_tags<<EOF"
            echo "${REGISTRY_IMAGE}:$IMAGE_TAG"
            if [ "$IS_VERSIONED" = "true" ]; then
              echo "${REGISTRY_IMAGE}:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        id: build_push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.resolve_tag.outputs.docker_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate Job Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          IMAGE_TAG: ${{ steps.resolve_tag.outputs.image_tag }}
          IS_VERSIONED: ${{ steps.resolve_tag.outputs.is_versioned }}
          TRIGGER_TYPE: ${{ steps.resolve_tag.outputs.trigger_type }}
          GIT_TAG: ${{ steps.resolve_tag.outputs.git_tag }}
          SHORT_SHA: ${{ steps.resolve_tag.outputs.short_sha }}
          DIGEST: ${{ steps.build_push.outputs.digest }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -u
          IMAGE_TAG="${IMAGE_TAG:-N/A}"
          TRIGGER_TYPE="${TRIGGER_TYPE:-${{ github.event_name }}}"
          SHORT_SHA="${SHORT_SHA:-${COMMIT_SHA:0:7}}"
          DIGEST="${DIGEST:-N/A}"
          DOCKERHUB_URL="https://hub.docker.com/r/$REGISTRY_IMAGE"
          COMMIT_URL="https://github.com/$REPOSITORY/commit/$COMMIT_SHA"
          RUN_URL="https://github.com/$REPOSITORY/actions/runs/$RUN_ID"

          if [ "$JOB_STATUS" = "success" ]; then
            STATUS="✅ Success"
            HEADER="# 🚀 Docker Build & Push"
          else
            STATUS="❌ Failed"
            HEADER="# ❌ Docker Build & Push Failed"
          fi

          if [ "${IS_VERSIONED:-false}" = "true" ]; then
            TAGS="\`$IMAGE_TAG\` (also tagged as \`latest\`)"
            IMAGES="[\`$REGISTRY_IMAGE:$IMAGE_TAG\`]($DOCKERHUB_URL)<br>[\`$REGISTRY_IMAGE:latest\`]($DOCKERHUB_URL)"
          else
            TAGS="\`$IMAGE_TAG\`"
            IMAGES="[\`$REGISTRY_IMAGE:$IMAGE_TAG\`]($DOCKERHUB_URL)"
          fi

          {
            echo "$HEADER"
            echo
            echo "## Execution Status"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Status | $STATUS |"
            echo "| Trigger | $TRIGGER_TYPE |"
            echo "| Git tag | \`${GIT_TAG:-N/A}\` |"
            echo "| Image tags | $TAGS |"
            echo "| Commit | [\`$SHORT_SHA\`]($COMMIT_URL) |"
            echo "| Workflow run | [#$RUN_ID]($RUN_URL) |"
            echo
            echo "## Docker Image"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Image | $IMAGES |"
            echo "| Registry | $REGISTRY_NAME |"
            echo "| Build and push | $STATUS |"
            echo "| Digest | \`$DIGEST\` |"
          } >> "$GITHUB_STEP_SUMMARY"
