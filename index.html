<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        try {
          const storedPreference = localStorage.getItem('vigo-theme');
          const preference = storedPreference === 'light' || storedPreference === 'dark' || storedPreference === 'system'
            ? storedPreference
            : 'system';
          const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          const theme = preference === 'system' ? (systemDark ? 'dark' : 'light') : preference;
          document.documentElement.dataset.theme = theme;
          document.documentElement.dataset.themePreference = preference;
        } catch {
          document.documentElement.dataset.theme = 'light';
          document.documentElement.dataset.themePreference = 'system';
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/vigo-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Vigo — a shared space for athletes and coaches." />
    <title>Vigo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
